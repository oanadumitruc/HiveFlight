# HiveFlight Drone Swarm Simulation Configuration
# Advanced Reynolds Boids with obstacles and target seeking

# World dimensions
worldWidth=800.0
worldHeight=600.0
wrapAround=true

# Swarm configuration
droneCount=25
seed=42

# Initial positions and velocities
posMin=100.0
posMax=700.0
velMin=-15.0
velMax=15.0

# Simulation parameters
dt=0.1
steps=200
sleepMs=50

# Flocking parameters - Perception radii
separationRadius=60.0
alignmentRadius=120.0
cohesionRadius=120.0
perceptionRadius=120.0

# Force weights (balance of behaviors)
weightSeparation=1.8      # Avoid crowding
weightAlignment=1.0       # Align velocity with neighbors
weightCohesion=1.0        # Move toward neighbor center
weightTarget=0.8          # Seek the moving target
weightObstacle=2.5        # Avoid obstacles

# Speed and acceleration limits
maxSpeed=60.0
maxForce=15.0
desiredSeparationSpeed=50.0

# Battery system
batteryDrainRate=0.0015

# Obstacle avoidance buffer
obstacleBuffer=3.0

# Rendering
renderPpm=false
renderImageW=800
renderImageH=600
renderEvery=1
renderFramesDir=frames
